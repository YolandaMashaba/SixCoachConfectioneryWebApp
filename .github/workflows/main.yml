name: CI Workflow

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancel running workflows if a new push/PR update happens on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Application
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install dependencies using clean install
      - name: Install dependencies
        run: npm ci

      # Step 4: Run linter (if configured in package.json)
      - name: Run ESLint
        run: npm run lint --if-present

      # Step 5: Run unit/integration tests (if test script exists)
      - name: Run Tests
        run: npm test --if-present

      # Step 6: Build Vite production bundle
      - name: Build Application
        run: npm run build
